[package]
name = "blaze-db"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
name = "blaze_db"
path = "src/lib.rs"
bench = false

[[bin]]
name = "blzcli"
path = "src/bin/client.rs"
bench = false

[[bin]]
name = "blzdb"
path = "src/bin/server.rs"
bench = false

[[bench]]
name = "benchmark"
path = "benches/benchmark.rs"
harness = false

[[example]]
name = "ivf"
path = "sandbox/ivf.rs"

[[example]]
name = "hnsw"
path = "sandbox/hnsw.rs"

[[example]]
name = "nsw"
path = "sandbox/nsw.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
strip = true
incremental = false
debug = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
debug = false

[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = true
incremental = true

[dependencies]
tokio = { version = "1.51.0", features = ["full"] }
memmap2 = "0.9.10"
rayon = "1.11.0"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
colored = "3.1.1"
wincode = { version = "0.5.1", features = ["derive", "std"] }
clap = { version = "4.6.0", features = ["derive"] }
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors"] }
uuid = { version = "1.23.0", features = ["v4"] }
dirs = "6.0.0"
chrono = "0.4.44"
wide = "1.1.1"
sha2 = "0.11.0"
csv = "1.4.0"
rand = "0.10.0"
indicatif = { version = "0.18.4", features = ["rayon"] }
sysinfo = "0.38.4"
lazy_static = "1.5.0"
lru = "0.16.3"
dotenv = "0.15.0"
zstd = "0.13.3"
tar = "0.4.45"
tempfile = "3.27.0"
hex = "0.4.3"
futures = "0.3.32"
dashmap = "6.1.0"
fastrand = "2.3.0"
