[package]
name = "blaze-db"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
name = "blaze_db"
path = "src/lib.rs"

[[bin]]
name = "blzdb"
path = "src/bin/client.rs"

[[bin]]
name = "blzsrv"
path = "src/bin/server.rs"

[[bin]]
name = "nsw"
path = "sandbox/nsw.rs"

[[bin]]
name = "hnsw"
path = "sandbox/hnsw.rs"

[[bin]]
name = "fst-emd"
path = "sandbox/fastembedd.rs"

[[bench]]
name = "benchmark"
path = "benches/benchmark.rs"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
debug = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
strip = true
incremental = false
debug = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
incremental = false
debug = false

[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 1
debug = true
incremental = true

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
memmap2 = "0.9.9"
rayon = "1.11.0"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.100"
colored = "3.1.1"
wincode = { version = "0.4.3", features = ["derive"] }
clap = { version = "4.5.58", features = ["derive"] }
axum = "0.8.8"
uuid = { version = "1.20.0", features = ["v4"] }
dirs = "6.0.0"
toml = { version = "0.9.8" }
chrono = "0.4.43"
wide = "1.1.1"
sha2 = "0.10.9"
csv = "1.4.0"
rand = "0.10.0"
indicatif = "0.18.3"
sysinfo = "0.38.0"
lazy_static = "1.5.0"
lru = "0.16.3"
dotenv = "0.15.0"
cliclack = "0.3.8"
regex = "1.12.2"
zstd = "0.13.3"
tar = "0.4.44"
# fs2 = "0.4.3"
# walkdir = "2.5.0"
# rkyv = { version = "0.8.15" , features = ["std", "bytecheck"] }
# thiserror = "2.0.18"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.25.0"
futures = "0.3.31"
fastrand = "2.3.0"
