[package]
name = "blaze-db"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
name = "blaze_db"
path = "src/lib.rs"

[[bin]]
name = "blaze-db"
path = "src/bin/client.rs"

[[bin]]
name = "blaze-server"
path = "src/bin/server.rs"

[[bench]]
name = "benchmark"
path = "benches/benchmark.rs"
harness = false

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
memmap2 = "0.9.9"
rayon = "1.11.0"
reqwest = { version = "0.12.24", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.145"
anyhow = "1.0.100"
colored = "3.0.0"
bincode = "2.0.1"
clap = { version = "4.5.46", features = ["derive"] }
axum = "0.8.7"
uuid = { version = "1.11.0", features = ["v4"] }
dirs = "6.0.0"
toml = "0.9.8"
chrono = "0.4.42"
wide = "1.0.2"

[dev-dependencies]
criterion = "0.8.0"
tempfile = "3.8"