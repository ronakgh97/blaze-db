services:
  blazedb:
    build:
      context: .
      dockerfile: Dockerfile
    image: blazedb:latest
    container_name: blazedb-server
    #expose:
    #  - 8080
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    volumes:
      - blazedb-config:/home/blazedb/.config/blaze
      - blazedb-sources:/home/blazedb/blaze
    environment:
      - RUST_LOG=info
      - HOME=/home/blazedb
      #- PORT=8080
      #- EMBEDDING_MODEL=text-embedding-qwen3-embedding-0.6b
      #- EMBEDDING_API_URL=http://host.docker.internal:1234/v1/embeddings
      #- EMBEDDING_API_KEY=local
    command: [ "serve" ]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "test", "-f", "/app/blzsrv" ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - blazedb-network
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G
    #     reservations:
    #       cpus: '1'
    #       memory: 2G

volumes:
  blazedb-config:
    driver: local
  blazedb-sources:
    driver: local

networks:
  blazedb-network:
    driver: bridge
